services:
  cortendesk:
    image: ghcr.io/marcpope/cortendesk:1.15.0
    container_name: suporte_remoto
    hostname: suporte
    restart: unless-stopped
    environment:
      APP_NAME: Magbel Remote
      APP_URL: https://suporte.magbel.com.br
      SESSION_SECURE_COOKIE: 'true'
      CORTENDESK_ID_SERVER: rustdesk.magbel.com.br:21116
      CORTENDESK_RELAY_SERVER: rustdesk.magbel.com.br:21117
      CORTENDESK_PUBLIC_KEY: C8F+OtI1MIGs193mJnfYZcwl5iLmOWev5s+8gTWmFkE=
      CORTENDESK_RDGEN_URL: ${CORTENDESK_RDGEN_URL}
      CORTENDESK_NATIVE_WEBCLIENT: 'true'
      CORTENDESK_EMBEDDED_SERVER: 'true'
      MAGBEL_SESSION_TOKEN_GROUPS: '{"facilitador-tjpb-sessoes":"TJPB"}'
    volumes:
    - /opt/cortendesk/data:/data
    - /opt/cortendesk/branding-1.15.0/cortendesk-logo-light.svg:/app/public/assets/images/cortendesk-logo-light.svg:ro
