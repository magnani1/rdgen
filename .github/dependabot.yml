version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/facilitador-agent"
    schedule:
      interval: daily
      time: "08:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
