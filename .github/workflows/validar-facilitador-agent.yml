name: Validar agente Facilitador Windows
on:
  workflow_dispatch:
  pull_request:
    paths: ['facilitador-agent/**', '.github/workflows/validar-facilitador-agent.yml']
  push:
    branches: [master]
    paths: ['facilitador-agent/**', '.github/workflows/validar-facilitador-agent.yml']
permissions:
  contents: read
jobs:
  validar:
    strategy:
      matrix:
        python: ['3.12', '3.14', '3.15']
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r facilitador-agent/requirements.txt
      - run: python -m py_compile facilitador-agent/facilitador-agent.py
      - run: python -m unittest discover -s facilitador-agent/tests -v
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in @('facilitador-agent/instalar-agente.ps1','facilitador-agent/preparar-pacote-assinado.ps1','facilitador-agent/gerenciar-frota.ps1','facilitador-agent/preparar-python-remoto.ps1','facilitador-agent/migrar-conta-agente.ps1','facilitador-agent/atualizar-codigo-agente.ps1','facilitador-agent/manutencao-agente.ps1','facilitador-agent/preparar-manutencao-permanente.ps1','facilitador-agent/instalar-manutencao-permanente.ps1','facilitador-agent/instalar-manutencao-remota.ps1','facilitador-agent/diagnosticar-manutencao-remota.ps1','facilitador-agent/atualizar-manutencao-permanente.ps1','facilitador-agent/preparar-winget-207.ps1','facilitador-agent/worker/Executar-WinRM.ps1','facilitador-agent/worker/Executar-Guardado.ps1','facilitador-agent/publicar-worker-serial.ps1','facilitador-agent/preparar-monitoramento-208.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | Format-List; exit 1 }
          }
      - shell: pwsh
        run: ./facilitador-agent/tests/test_installer.ps1
      - shell: pwsh
        run: ./facilitador-agent/tests/test_migration.ps1
      - shell: pwsh
        run: ./facilitador-agent/tests/test_code_update.ps1
      - shell: pwsh
        run: ./facilitador-agent/tests/test_maintenance.ps1
      - shell: pwsh
        run: ./facilitador-agent/tests/test_worker_logs.ps1
  empacotar_assistente:
    needs: validar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r facilitador-agent/requirements-build.txt
      - run: python -m PyInstaller --clean --noconfirm --onefile --windowed --uac-admin --name Magbel-Facilitador-Setup --distpath dist-assistant --workpath build-assistant facilitador-agent/setup_assistant.py
      - shell: pwsh
        run: |
          if (-not (Test-Path 'dist-assistant/Magbel-Facilitador-Setup.exe')) { throw 'EXE não foi produzido.' }
          Get-FileHash dist-assistant/Magbel-Facilitador-Setup.exe -Algorithm SHA256 | Format-List
      - shell: pwsh
        timeout-minutes: 3
        run: ./facilitador-agent/tests/test_signature_windows.ps1 -AssistantExe dist-assistant/Magbel-Facilitador-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Magbel-Facilitador-Setup-nao-assinado
          path: dist-assistant/Magbel-Facilitador-Setup.exe
          retention-days: 14


