name: Auditoria diaria de dependencias
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
  push:
    branches: [master]
    paths: ['**/requirements*.txt', '.github/workflows/auditoria-dependencias.yml']
  pull_request:
    paths: ['**/requirements*.txt', '.github/workflows/auditoria-dependencias.yml']
permissions:
  contents: read
jobs:
  auditar:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: ["requirements.txt","facilitador-agent/requirements.txt","facilitador-agent/requirements-build.txt"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar ferramenta somente no runner
        run: python -m pip install pip-audit
      - name: Auditar dependencias declaradas e transitivas
        env:
          REQUIREMENTS_FILE: ${{ matrix.requirements }}
        run: python -m pip_audit --strict -r "$REQUIREMENTS_FILE" --format json --output auditoria.json
      - name: Publicar relatorio mesmo quando houver falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-${{ strategy.job-index }}
          path: auditoria.json
          if-no-files-found: warn
          retention-days: 30
  python_publicado:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verificar-python-estavel.py --reviewed 3.15.1
