name: Suporte Magbel Stable

run-name: >-
  Suporte Magbel
  ${{ inputs.version || 'latest-stable' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versao stable do RustDesk (ex.: 1.5.0). Vazio = ultima stable"
        required: false
        default: ""
        type: string
      force:
        description: "Recriar release se ja existir"
        required: false
        default: false
        type: boolean

  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: suporte-magbel-stable
  cancel-in-progress: false

env:
  PRODUCT_NAME: "Suporte Magbel"
  COMPANY_NAME: "Magbel"
  SERVER: "rustdesk.magbel.com.br"
  SERVER_PORT: "21116"
  API_SERVER: "https://suporte.magbel.com.br"
  WEBSITE: "https://suporte.magbel.com.br"

  # Chave publica RustDesk. Nao e credencial secreta.
  PUBLIC_KEY: "C8F+OtI1MIGs193mJnfYZcwl5iLmOWev5s+8gTWmFkE="

jobs:
  resolve:
    name: Detectar stable
    runs-on: ubuntu-24.04

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}

    steps:
      - name: Checkout Magbel
        uses: actions/checkout@v4

      - name: Resolver versao
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          FORCE_BUILD: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED_VERSION:-}" ]; then
            VERSION="${REQUESTED_VERSION#v}"
          else
            VERSION="$(
              gh api \
                --paginate \
                repos/rustdesk/rustdesk/releases \
                --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
              sed 's/^v//' |
              grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
              sort -V |
              tail -1
            )"
          fi

          if [ -z "$VERSION" ]; then
            echo "Nao foi possivel determinar a ultima stable."
            exit 1
          fi

          # Confirma que a tag realmente existe no RustDesk.
          if ! git ls-remote \
              --exit-code \
              --tags \
              https://github.com/rustdesk/rustdesk.git \
              "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag RustDesk '$VERSION' nao encontrada."
            exit 1
          fi

          TAG="suporte-magbel-v${VERSION}"

          BUILD=true
          if gh release view "$TAG" \
              --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            if [ "${FORCE_BUILD:-false}" != "true" ]; then
              BUILD=false
            fi
          fi

          echo "Stable RustDesk: $VERSION"
          echo "Release Magbel: $TAG"
          echo "Build necessario: $BUILD"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"

  preflight:
    name: Validar personalizacao antes dos builds
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Magbel
        uses: actions/checkout@v4
        with:
          path: magbel
      - name: Checkout RustDesk oficial stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
          submodules: recursive
          path: rustdesk
      - name: Validar patch, consumidores dos recursos e checkout Windows
        shell: bash
        run: |
          set -euo pipefail
          git -c core.autocrlf=true clone --quiet --no-local magbel "$RUNNER_TEMP/magbel-windows-checkout"
          python3 "$RUNNER_TEMP/magbel-windows-checkout/.github/scripts/magbel_patch.py" --root rustdesk --product "$PRODUCT_NAME" --company "$COMPANY_NAME" --server "$SERVER" --port "$SERVER_PORT" --key "$PUBLIC_KEY" --api "$API_SERVER" --website "$WEBSITE"
          python3 magbel/.github/scripts/verify_magbel_source.py --root rustdesk

  preflight_windows:
    name: Validar gerador portatil no Windows
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout RustDesk oficial stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar caminho inicial no formato oficial
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install -r libs/portable/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixture = Join-Path $env:RUNNER_TEMP "magbel portable smoke/Release"
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          $bundle = (Resolve-Path $fixture).Path
          [IO.File]::WriteAllBytes((Join-Path $bundle "$env:PRODUCT_NAME.exe"), [byte[]](77,90,0,1))
          $payload = Join-Path $env:RUNNER_TEMP "magbel-portable-smoke.bin"
          python libs/portable/generate.py -f $bundle -o libs/portable -e (Join-Path $bundle "$env:PRODUCT_NAME.exe") --package $payload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import sys
          trailer = Path(sys.argv[1]).read_bytes().rsplit(b'rustdesk', 1)[1]
          executable = trailer.decode().replace(chr(92), '/').removeprefix('./')
          assert executable == sys.argv[2] + '.exe', executable
          print('OK: gerador oficial inicia o EXE personalizado na raiz do pacote.')
          '@ | python - $payload $env:PRODUCT_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  bridge:
    name: Gerar Flutter Rust Bridge
    needs: [resolve, preflight, preflight_windows]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout RustDesk stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
          submodules: recursive

      - name: Dependencias do bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Instalar Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Instalar Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"

      - name: Gerar bridge
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features "uuid" --locked

          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd

          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

          test -f ./src/bridge_generated.rs
          test -f ./src/bridge_generated.io.rs
          test -f ./flutter/lib/generated_bridge.dart
          test -f ./flutter/lib/generated_bridge.freezed.dart

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  windows:
    name: Windows x64
    needs: [resolve, bridge]
    if: needs.resolve.outputs.build == 'true'
    runs-on: windows-2022

    steps:
      - name: Checkout Magbel
        uses: actions/checkout@v4
        with:
          path: magbel

      - name: Checkout RustDesk stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
          submodules: recursive
          path: rustdesk

      - name: Restaurar Flutter Rust Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Instalar LLVM/Clang oficial
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Preparar engine e patch Flutter do RustDesk
        shell: powershell
        working-directory: rustdesk
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $flutterRoot = Split-Path -Parent (Split-Path -Parent (Get-Command flutter).Source)
          $engineDest = Join-Path $flutterRoot "bin\cache\artifacts\engine\windows-x64-release"
          New-Item -ItemType Directory -Force -Path $engineDest | Out-Null
          Copy-Item -Recurse -Force windows-x64-release\* $engineDest

      - name: Patch Flutter 3.24.5
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Instalar Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Preparar vcpkg Windows
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Instalar dependencias vcpkg Windows
        shell: bash
        working-directory: rustdesk
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install             --triplet x64-windows-static             --x-install-root="$VCPKG_ROOT/installed"

      - name: Preparar branding e configuracao
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python ../magbel/.github/scripts/magbel_patch.py             --root .             --product "$PRODUCT_NAME"             --company "$COMPANY_NAME"             --server "$SERVER"             --port "$SERVER_PORT"             --key "$PUBLIC_KEY"             --api "$API_SERVER"             --website "$WEBSITE"

      - name: Build Windows x64
        shell: powershell
        working-directory: rustdesk
        run: |
          python .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Testar defaults de conexao Magbel
        shell: powershell
        working-directory: rustdesk
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "magbel-settings-test.log"
          cargo test --locked --manifest-path libs/hbb_common/Cargo.toml --lib --release --features webrtc magbel_connection_defaults | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path $log -SimpleMatch "config::magbel_connection_tests::magbel_connection_defaults ... ok" -Quiet)) { throw "Teste Magbel nao executado." }

      - name: Empacotar cliente Windows personalizado
        shell: powershell
        working-directory: rustdesk
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = (Resolve-Path "flutter/build/windows/x64/runner/Release").Path
          Rename-Item -Path (Join-Path $bundle "rustdesk.exe") -NewName "$env:PRODUCT_NAME.exe"
          python -m pip install -r libs/portable/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python libs/portable/generate.py -f $bundle -o libs/portable -e (Join-Path $bundle "$env:PRODUCT_NAME.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/rustdesk-portable-packer.exe "rustdesk-${{ needs.resolve.outputs.version }}-install.exe"

      - name: Verificar pacote Windows Magbel
        shell: powershell
        working-directory: rustdesk
        run: |
          $ErrorActionPreference = "Stop"
          $package = @(Get-ChildItem -Path . -Filter "rustdesk-*-install.exe" -File)
          if ($package.Count -ne 1) { throw "Pacote portatil nao encontrado." }
          python ../magbel/.github/scripts/verify_magbel_bundle.py --platform windows --bundle flutter/build/windows/x64/runner/Release --portable-data libs/portable/data.bin --portable-exe $package[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Localizar EXE
        shell: powershell
        working-directory: rustdesk
        run: |
          $ErrorActionPreference = "Stop"
          $packages = @(Get-ChildItem -Path . -Filter "rustdesk-*-install.exe" -File)
          if ($packages.Count -ne 1) {
            throw "Esperado um pacote portatil completo; encontrados $($packages.Count)."
          }
          Copy-Item $packages[0].FullName "..\suporte-magbel-${{ needs.resolve.outputs.version }}-windows-x64.exe"

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: suporte-magbel-windows-x64
          path: suporte-magbel-*-windows-x64.exe
          if-no-files-found: error

  linux:
    name: Linux x64 AppImage
    needs: [resolve, bridge]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Magbel
        uses: actions/checkout@v4
        with:
          path: magbel

      - name: Checkout RustDesk stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
          submodules: recursive
          path: rustdesk

      - name: Restaurar Flutter Rust Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Dependencias Linux
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          # O GStreamer do Ubuntu 22.04 depende explicitamente de libunwind-dev.
          # Instalamos primeiro para evitar a resolucao quebrada observada no runner.
          sudo apt-get install -y --no-install-recommends libunwind-dev

          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl gcc g++ git \
            libayatana-appindicator3-dev libasound2-dev \
            libclang-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgtk-3-dev libpulse-dev libva-dev \
            libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxdo-dev libxfixes-dev llvm-dev nasm ninja-build \
            pkg-config python3 python3-pip rpm unzip wget xz-utils libssl-dev \
            libarchive-tools libfuse2

          sudo apt-get remove -y libopus-dev || true

          dpkg-query -W \
            libunwind-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libxcb-randr0-dev \
            libgtk-3-dev \
            libva-dev

      - name: Instalar Rust 1.75
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Preparar vcpkg Linux
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          VCPKG_DIR="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_DIR"
          git -C "$VCPKG_DIR" checkout 9e593bb18ea69cc5095e012465dcd675a822ed0d
          "$VCPKG_DIR/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$VCPKG_DIR" >> "$GITHUB_ENV"
          "$VCPKG_DIR/vcpkg" install             --triplet x64-linux             --x-install-root="$VCPKG_DIR/installed"

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Patch Flutter 3.24.5
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Preparar branding e configuracao
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 ../magbel/.github/scripts/magbel_patch.py             --root .             --product "$PRODUCT_NAME"             --company "$COMPANY_NAME"             --server "$SERVER"             --port "$SERVER_PORT"             --key "$PUBLIC_KEY"             --api "$API_SERVER"             --website "$WEBSITE"

      - name: Build Rust Linux
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          sed -i 's/\["cdylib", "staticlib", "rlib"\]/["cdylib"]/g' Cargo.toml
          cargo build --locked --lib             --features hwcodec,flutter,unix-file-copy-paste             --release

      - name: Testar defaults de conexao Magbel
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path libs/hbb_common/Cargo.toml --lib --release --features webrtc magbel_connection_defaults | tee "$RUNNER_TEMP/magbel-settings-test.log"
          grep -F "config::magbel_connection_tests::magbel_connection_defaults ... ok" "$RUNNER_TEMP/magbel-settings-test.log"

      - name: Gerar pacote DEB base
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 ./build.py --flutter --skip-cargo
          DEB="$(find . -maxdepth 2 -type f -name 'rustdesk*.deb' | head -1 || true)"
          if [ -z "$DEB" ]; then
            echo "Pacote DEB nao foi produzido."
            exit 1
          fi
          cp "$DEB" ./appimage/rustdesk.deb

      - name: Gerar AppImage oficial
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 -m pip install --user "setuptools_scm<10"
          python3 -m pip install --user git+https://github.com/rustdesk-org/appimage-builder.git
          export PATH="$HOME/.local/bin:$PATH"
          # Extrai o DEB sem depender da compressao interna (xz ou zstd).
          sed -i \
            -e 's|bsdtar -zxvf rustdesk.deb|dpkg-deb -x rustdesk.deb .|' \
            -e '/tar -xvf \.\/data\.tar\.xz/d' \
            appimage/AppImageBuilder-x86_64.yml
          pushd appimage
          ./build-apprun.sh x86_64
          sudo -E env "PATH=$PATH" appimage-builder --skip-tests --recipe ./AppImageBuilder-x86_64.yml
          cmp AppDir/AppRun appimage-build/AppRun/v2.0.0/AppRun-Release-x86_64
          popd
          APPIMAGE="$(find ./appimage -maxdepth 1 -type f -name '*.AppImage' | head -1 || true)"
          if [ -z "$APPIMAGE" ]; then
            echo "AppImage final nao encontrado."
            exit 1
          fi
          cp "$APPIMAGE" "../suporte-magbel-${{ needs.resolve.outputs.version }}-linux-x64.AppImage"

      - name: Verificar AppImage Magbel
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$GITHUB_WORKSPACE/suporte-magbel-${{ needs.resolve.outputs.version }}-linux-x64.AppImage"
          mkdir -p "$RUNNER_TEMP/magbel-appimage-check"
          cd "$RUNNER_TEMP/magbel-appimage-check"
          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          python3 "$GITHUB_WORKSPACE/magbel/.github/scripts/verify_magbel_bundle.py" --platform linux --bundle squashfs-root

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: suporte-magbel-linux-x64
          path: suporte-magbel-*-linux-x64.AppImage
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: [resolve, bridge]
    if: needs.resolve.outputs.build == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            vcpkg_triplet: x64-osx
            extra: ""
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-14
            vcpkg_triplet: arm64-osx
            extra: "--screencapturekit"

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Magbel
        uses: actions/checkout@v4
        with:
          path: magbel

      - name: Checkout RustDesk stable
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ needs.resolve.outputs.version }}
          submodules: recursive
          path: rustdesk

      - name: Restaurar Flutter Rust Bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: rustdesk

      - name: Dependencias macOS
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm create-dmg imagemagick
          if ! command -v pkg-config >/dev/null 2>&1; then
            brew install pkg-config
          fi
          cd /tmp
          curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"

      - name: Patch e workaround Flutter
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          git -C "$FLUTTER_ROOT" apply "$GITHUB_WORKSPACE/rustdesk/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g'             "$FLUTTER_ROOT/packages/flutter/lib/src/scheduler/binding.dart"

      - name: Instalar Rust 1.81
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for ATTEMPT in 1 2 3; do
            if rustup toolchain install 1.81.0 --profile minimal \
                --target "$RUST_TARGET" --component rustfmt --no-self-update; then
              rustup default 1.81.0
              rustc --version
              break
            fi
            if [ "$ATTEMPT" -eq 3 ]; then
              echo "Nao foi possivel instalar Rust apos tres tentativas."
              exit 1
            fi
            sleep 15
          done

      - name: Preparar vcpkg macOS
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          doNotCache: false

      - name: Instalar dependencias vcpkg macOS
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install             --triplet "${{ matrix.vcpkg_triplet }}"             --x-install-root="$VCPKG_ROOT/installed"

      - name: Preparar branding
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 ../magbel/.github/scripts/magbel_patch.py             --root .             --product "$PRODUCT_NAME"             --company "$COMPANY_NAME"             --server "$SERVER"             --port "$SERVER_PORT"             --key "$PUBLIC_KEY"             --api "$API_SERVER"             --website "$WEBSITE"


      - name: Ajustar minimo macOS ARM64
        if: matrix.arch == 'arm64'
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj

      - name: Build macOS
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          python3 ./build.py             --flutter             --hwcodec             --unix-file-copy-paste             ${{ matrix.extra }}

      - name: Testar defaults de conexao Magbel
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path libs/hbb_common/Cargo.toml --lib --release --features webrtc magbel_connection_defaults | tee "$RUNNER_TEMP/magbel-settings-test.log"
          grep -F "config::magbel_connection_tests::magbel_connection_defaults ... ok" "$RUNNER_TEMP/magbel-settings-test.log"

      - name: Assinatura ad-hoc e DMG
        shell: bash
        working-directory: rustdesk
        run: |
          set -euo pipefail
          APP="$(find ./flutter/build/macos/Build/Products/Release -maxdepth 1 -type d -name '*.app' | head -1)"
          test -n "$APP"
          BRANDED_APP="$(dirname "$APP")/$PRODUCT_NAME.app"
          mv "$APP" "$BRANDED_APP"
          APP="$BRANDED_APP"
          xattr -cr "$APP" || true
          bash .github/scripts/sign-macos-app.sh "$APP" - flutter/macos/Runner/Release.entitlements
          python3 ../magbel/.github/scripts/verify_magbel_bundle.py --platform macos --bundle "$APP"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg             --volname "$PRODUCT_NAME"             --window-size 800 400             --icon-size 100             --app-drop-link 600 185             "../suporte-magbel-${{ needs.resolve.outputs.version }}-macos-${{ matrix.arch }}.dmg"             "$APP"

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: suporte-magbel-macos-${{ matrix.arch }}
          path: suporte-magbel-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [resolve, windows, linux, macos]
    if: |
      always() &&
      needs.resolve.outputs.build == 'true' &&
      needs.windows.result == 'success' &&
      needs.linux.result == 'success' &&
      needs.macos.result == 'success'

    runs-on: ubuntu-24.04

    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          pattern: suporte-magbel-*
          path: dist
          merge-multiple: true

      - name: Criar aliases stable e SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd dist

          cp "suporte-magbel-${{ needs.resolve.outputs.version }}-windows-x64.exe" \
             "suporte-magbel-stable.exe"

          cp "suporte-magbel-${{ needs.resolve.outputs.version }}-linux-x64.AppImage" \
             "suporte-magbel-stable.AppImage"

          cp "suporte-magbel-${{ needs.resolve.outputs.version }}-macos-x64.dmg" \
             "suporte-magbel-stable-macos-x64.dmg"

          cp "suporte-magbel-${{ needs.resolve.outputs.version }}-macos-arm64.dmg" \
             "suporte-magbel-stable-macos-arm64.dmg"

          sha256sum * > SHA256SUMS.txt

      - name: Publicar GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve.outputs.tag }}"
          VERSION="${{ needs.resolve.outputs.version }}"

          gh release delete "$TAG" --cleanup-tag \
            --repo "$GITHUB_REPOSITORY" \
            --yes 2>/dev/null || true

          gh release create "$TAG" \
            dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Suporte Magbel $VERSION" \
            --notes "Suporte Magbel baseado no RustDesk stable $VERSION."
